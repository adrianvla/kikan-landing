<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mLearn</title>
<link rel="canonical" href="https://mlearn.kikan.net/">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f7f7f8; color: #1c1c1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border: 1px solid #e2e2e6; border-radius: 12px; padding: 32px; max-width: 420px; margin: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { font-size: 14px; line-height: 1.55; color: #4a4a50; margin: 0 0 16px; }
  .spinner { width: 24px; height: 24px; border: 3px solid #e2e2e6; border-top-color: #2563eb; border-radius: 50%; margin: 16px auto; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback { display: none; }
  a.btn { display: block; text-align: center; background: #2563eb; color: #fff; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  a.btn.secondary { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
</style>
</head>
<body>
<div class="card">
  <h1>mLearn</h1>
  <div class="spinner"></div>
  <p id="status">Please wait</p>
  <div class="fallback" id="fallback">
    <p>You can also open the site directly:</p>
    <a class="btn" href="https://mlearn.kikan.net/">Global</a>
    <a class="btn secondary" href="https://ru.mlearn.kikan.net/">Russia</a>
  </div>
</div>
<noscript>
  <style>.spinner, #status { display: none; } .fallback { display: block !important; }</style>
</noscript>
<script>
(function () {
  var suffix = location.pathname + location.search + location.hash;
  var globalUrl = 'https://mlearn.kikan.net' + suffix;
  var ruUrl = 'https://ru.mlearn.kikan.net' + suffix;
  var done = false;
  function go(url) {
    if (done) return;
    done = true;
    location.replace(url);
  }
  function fallback() {
    if (done) return;
    done = true;
    document.getElementById('status').textContent = '';
    document.getElementById('fallback').style.display = 'block';
  }
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); fallback(); }, 5000);
  fetch('https://ip2c.org/s', { signal: ctrl.signal })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      clearTimeout(timer);
      var code = (t.split(';')[1] || '').toUpperCase();
      go(code === 'RU' ? ruUrl : globalUrl);
    })
    .catch(fallback);
})();
</script>
</body>
</html>
